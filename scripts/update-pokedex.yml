name: Update Champions Battle Data (pokedex + sprites)

on:
  schedule:
    # Runs weekly (Mondays 06:00 UTC) — championsbattledata.com refreshes
    # its "Current" battle data more often than Smogon's monthly stats,
    # so this stays fresher on a shorter cycle than update-usage.yml.
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-pokedex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Champions battle data + sprites
        run: node scripts/fetch-pokedex.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pokedex.json assets/sprites
          git diff --cached --quiet || git commit -m "Update Champions battle data"
          git push
