name: Update Champions VGC usage data

on:
  schedule:
    # Runs at 06:00 UTC on the 3rd of each month — Smogon's monthly
    # stats for the prior month are usually published by then.
    - cron: "0 6 3 * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and parse Champions VGC usage stats
        run: node scripts/fetch-usage.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update Champions VGC usage data"
          git push
