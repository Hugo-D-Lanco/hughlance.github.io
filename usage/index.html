<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usage & Synergy — Roster Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14181C; --surface: #1B2126; --surface-2: #222A31; --line: #2C363E;
    --text: #EDEFF1; --text-muted: #8B95A1; --accent: #E8C547; --accent-2: #3E7C8C;
    --up: #6FCB9F;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background: var(--bg); color: var(--text); font-family:'Inter', sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  a{ color:inherit; }

  .layout{ display:flex; height:100vh; }

  /* ---------------- Sidebar ---------------- */
  .sidebar{
    width: 360px; flex-shrink:0; height:100vh; display:flex; flex-direction:column;
    background: var(--surface); border-right: 1px solid var(--line);
  }
  .sidebar-top{ padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  a.back{ font-family:'JetBrains Mono', monospace; font-size: 0.74rem; color: var(--text-muted); text-decoration:none; }
  a.back:hover{ color: var(--text); }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 1.3rem; margin: 8px 0 12px; }

  .source-tabs{ display:flex; gap: 4px; margin-bottom: 10px; }
  .source-tab{
    flex:1; font-family:'JetBrains Mono', monospace; font-size: 0.66rem; text-align:center;
    padding: 8px 4px; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text-muted); cursor:pointer; border-radius: 2px; line-height:1.3;
  }
  .source-tab.active{ background: var(--accent); color: #14181C; border-color: var(--accent); font-weight:700; }
  .source-tab:hover:not(.active){ color: var(--text); }

  .sub-controls{ display:flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .elo-tab, .fmt-tab{
    font-family:'JetBrains Mono', monospace; font-size: 0.68rem;
    padding: 6px 10px; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text-muted); cursor:pointer; border-radius: 2px;
  }
  .elo-tab.active, .fmt-tab.active{ background: var(--accent-2); color: #fff; border-color: var(--accent-2); font-weight:700; }
  .elo-tab:disabled{ opacity: 0.3; cursor: not-allowed; }
  .elo-tab:hover:not(.active):not(:disabled){ color: var(--text); }
  .fmt-tab:hover:not(.active){ color: var(--text); }

  .no-elo-note{ font-family:'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--text-muted); margin-bottom: 10px; }

  input[type="text"]{
    width:100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
    padding: 8px 10px; font-family:'Inter', sans-serif; font-size: 0.85rem; border-radius: 2px;
  }

  .flag{
    display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size: 0.64rem;
    color: var(--accent); padding: 6px 0 0; letter-spacing: 0.02em;
  }
  .flag.live{ color: var(--up); }
  .flag .dot{ width:5px; height:5px; background: currentColor; border-radius:50%; flex-shrink:0; }

  .sidebar-list{ flex:1; overflow-y:auto; }
  .mon-row{
    display:flex; align-items:center; gap: 10px; padding: 9px 16px;
    cursor:pointer; border-bottom: 1px solid rgba(44,54,62,0.5);
  }
  .mon-row:hover{ background: var(--surface-2); }
  .mon-row.selected{ background: rgba(232,197,71,0.08); border-left: 2px solid var(--accent); padding-left: 14px; }
  .mon-rank{ font-family:'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); width: 26px; flex-shrink:0; }
  .mon-avatar{
    width: 30px; height: 30px; border-radius: 4px; flex-shrink:0; object-fit: contain;
    background: var(--surface-2); display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size: 0.62rem; font-weight:700;
  }
  .mon-name-wrap{ flex:1; min-width:0; }
  .mon-name{ font-family:'Space Grotesk', sans-serif; font-size: 0.85rem; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mon-type{ font-family:'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--text-muted); }
  .mon-metric{ font-family:'JetBrains Mono', monospace; font-size: 0.76rem; flex-shrink:0; text-align:right; min-width: 44px; }

  /* ---------------- Main panel ---------------- */
  .main{ flex:1; height:100vh; overflow-y:auto; padding: 32px 40px 60px; }
  .main-empty{ color: var(--text-muted); font-family:'JetBrains Mono', monospace; font-size: 0.85rem; margin-top: 80px; text-align:center; }

  .detail-hero{ display:flex; align-items:center; gap: 22px; margin-bottom: 24px; flex-wrap: wrap; }
  .detail-avatar-wrap{ position: relative; flex-shrink: 0; }
  .forme-cycle-btn{
    position: absolute; bottom: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-2); border: 2px solid var(--bg); color: #fff; cursor: pointer;
    display:flex; align-items:center; justify-content:center; font-size: 0.85rem; line-height: 1;
  }
  .forme-cycle-btn:hover{ background: var(--accent); color: #14181C; }
  .detail-avatar{
    width: 84px; height: 84px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center; object-fit: contain; font-family:'Space Grotesk', sans-serif;
    font-size: 1.6rem; font-weight:700; flex-shrink:0;
  }
  .detail-title h2{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: clamp(1.6rem, 3.4vw, 2.2rem); }
  .type-badges{ display:flex; gap: 6px; margin-top: 8px; }
  .type-badge{
    font-family:'JetBrains Mono', monospace; font-size: 0.72rem; font-weight:700;
    padding: 4px 11px; border-radius: 12px;
  }
  .detail-metrics{ display:flex; gap: 26px; margin-left: auto; flex-wrap: wrap; }
  .metric .num{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 1.7rem; }
  .metric .lbl{ font-family:'JetBrains Mono', monospace; font-size: 0.64rem; color: var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; }

  .grid2 .card, .grid3 .card{
    border: 1px solid var(--line); background: var(--surface); padding: 16px 18px;
    display:flex; flex-direction:column; height: 300px;
  }
  .grid2 .card h3, .grid3 .card h3{ flex-shrink:0; }
  .grid2 .card-body, .grid3 .card-body{ flex:1; min-height:0; overflow-y:auto; }
  .panel-label{ font-family:'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--accent-2); text-transform:uppercase; letter-spacing:0.06em; margin-bottom: 14px; }

  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
  .card h3{ font-family:'Space Grotesk', sans-serif; font-size: 0.95rem; margin-bottom: 12px; }
  .bar-row{ display:flex; align-items:center; gap: 10px; margin-bottom: 9px; font-size: 0.82rem; }
  .bar-row .label{ width: 42%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-row .track{ flex:1; height: 6px; background: var(--surface-2); border-radius: 4px; overflow:hidden; }
  .bar-row .fill{ height:100%; background: var(--accent-2); border-radius:4px; }
  .bar-row .pct{ font-family:'JetBrains Mono', monospace; font-size: 0.72rem; width: 40px; text-align:right; color: var(--text-muted); }
  .empty-note{ color: var(--text-muted); font-size: 0.82rem; }

  .tag-cloud{ display:flex; flex-wrap:wrap; gap: 6px; }
  .tag{ font-family:'JetBrains Mono', monospace; font-size: 0.7rem; background: var(--surface-2); border: 1px solid var(--line); padding: 4px 9px; border-radius: 10px; color: var(--text-muted); }

  .teammate-pill{ font-family:'JetBrains Mono', monospace; font-size: 0.74rem; background: var(--surface-2); border: 1px solid var(--line); padding: 6px 12px; border-radius: 12px; color: var(--text); cursor:pointer; display:inline-block; }
  .teammate-pill:hover{ border-color: var(--accent-2); }
  .teammate-pill b{ color: var(--accent-2); }

  .bar-row.clickable{ cursor: pointer; border-radius: 3px; padding: 3px 4px; margin: 0 -4px 6px; }
  .bar-row.clickable:hover{ background: var(--surface-2); }

  /* Selectable button-lists (moves/items/abilities/natures/spreads) */
  .select-list{ display:flex; flex-direction:column; gap: 6px; }
  .select-btn{
    display:flex; align-items:center; justify-content:space-between; gap: 10px;
    width: 100%; text-align:left; font-family:'Inter', sans-serif; font-size: 0.82rem;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 8px 11px; border-radius: 4px; cursor: pointer;
  }
  .select-btn:hover{ border-color: var(--accent-2); }
  .select-btn.active{ background: rgba(232,197,71,0.1); border-color: var(--accent); }
  .select-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .select-pct{ font-family:'JetBrains Mono', monospace; font-size: 0.74rem; color: var(--accent-2); flex-shrink:0; }
  .select-pct.muted{ color: var(--text-muted); }
  .select-btn.active .select-pct{ color: var(--accent); }

  /* Stat bars inside the grid — same width as any other card now,
     and a bit thicker since the Base stats card otherwise has empty
     space below its 6 short rows compared to scrollable list cards. */
  .stat-row{ display:flex; align-items:center; gap: 10px; font-size: 0.82rem; }
  .stat-row .label{ width: 30%; }
  .stat-row .track{ flex:1; height: 13px; background: var(--surface-2); border-radius: 6px; overflow:hidden; }
  .stat-row .fill{ height:100%; border-radius:6px; }
  .stat-row .num{ font-family:'JetBrains Mono', monospace; font-size: 0.76rem; width: 34px; text-align:right; }

  /* Export Pokémon — a normal grid card like everything else, not a
     special oversized one. */
  .export-text{
    font-family:'JetBrains Mono', monospace; font-size: 0.72rem; line-height: 1.55;
    white-space: pre-wrap; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
  }
  .export-copy{
    flex-shrink: 0; margin-top: 14px; width: 100%; font-family:'JetBrains Mono', monospace; font-size: 0.74rem;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text-muted);
    padding: 7px 12px; border-radius: 3px; cursor: pointer;
  }
  .export-copy:hover{ color: var(--text); border-color: var(--accent-2); }

  .menu-toggle{
    display:none; position: fixed; top: 14px; left: 14px; z-index: 30;
    width: 38px; height: 38px; border-radius: 6px; background: var(--surface);
    border: 1px solid var(--line); color: var(--text); cursor: pointer;
    align-items:center; justify-content:center; font-size: 1.1rem;
  }
  .sidebar-backdrop{
    display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 15;
  }

  @media (max-width: 860px){
    .grid2, .grid3{ grid-template-columns: 1fr; }
    .menu-toggle{ display:flex; }
    .layout{ position: relative; }
    .sidebar{
      position: fixed; top:0; left:0; z-index: 20; width: min(320px, 85vw);
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    .sidebar.open{ transform: translateX(0); }
    .sidebar-backdrop.open{ display:block; }
    .main{ padding: 60px 18px 40px; }
  }
</style>
</head>
<body>
<div class="layout">

  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Pokémon list">☰</button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="back" href="../index.html">← Roster Sheet</a>
      <h1>Usage & Synergy</h1>

      <div class="source-tabs" id="sourceTabs">
        <div class="source-tab" data-source="bo1">Bo1<br>Ladder</div>
        <div class="source-tab" data-source="bo3">Bo3<br>Open Sheet</div>
        <div class="source-tab" data-source="champions">Champions<br>In-Game</div>
      </div>

      <div class="sub-controls" id="eloTabs"></div>
      <div class="no-elo-note" id="noEloNote" style="display:none;">Champions has no ELO ladder — ranked by in-game usage instead.</div>

      <input type="text" id="search" placeholder="Search Pokémon…">
      <div class="flag" id="dataFlag"><span class="dot"></span>Loading…</div>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <main class="main" id="main">
    <div class="main-empty">Pick a data source and select a Pokémon to see its full profile.</div>
  </main>

</div>

<script>
const TYPE_COLORS = {
  Normal:"#A8A878", Fire:"#F08030", Water:"#6890F0", Electric:"#F8D030", Grass:"#78C850",
  Ice:"#98D8D8", Fighting:"#C03028", Poison:"#A040A0", Ground:"#E0C068", Flying:"#A890F0",
  Psychic:"#F85888", Bug:"#A8B820", Rock:"#B8A038", Ghost:"#705898", Dragon:"#7038F8",
  Dark:"#705848", Steel:"#B8B8D0", Fairy:"#EE99AC", Unknown:"#8B95A1"
};
function typeColor(t){ return TYPE_COLORS[t] || TYPE_COLORS.Unknown; }

// Skips blank-named entries (see selectableList's filter above) when
// picking a default — avoids defaulting to an unusable blank pick.
function firstValid(entries){
  return (entries || []).find(e => e && e.name && String(e.name).trim())?.name || null;
}

// Groups related formes together so the cycle button can hop between
// them — e.g. Charizard / Mega Charizard X / Mega Charizard Y all share
// the key "charizard"; Aegislash / Aegislash-Blade share "aegislash".
// Best-effort regex on the DISPLAY name (not a chaos ID), since that's
// all the front end has to work with.
function formeFamilyKey(name){
  return name
    .replace(/^Mega\s+/i, "")
    .replace(/\s+[XY]$/i, "")
    .replace(/^(Alolan|Galarian|Hisuian|Paldean)\s+/i, "")
    .split(/[-\s]/)[0]
    .toLowerCase();
}

function renderFormeCycleButton(allNames, currentName, onCycle){
  const family = allNames.filter(n => formeFamilyKey(n) === formeFamilyKey(currentName));
  if (family.length < 2) return null;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "forme-cycle-btn";
  btn.title = `Cycle formes (${family.length})`;
  btn.textContent = "⟳";
  btn.onclick = (e) => {
    e.stopPropagation();
    const idx = family.indexOf(currentName);
    const next = family[(idx + 1) % family.length];
    onCycle(next);
  };
  return btn;
}

// A Mega's recorded ability reflects what it has AFTER transforming
// in-battle — but a real Showdown export needs the base forme's ability
// (the one it has before the item triggers the Mega Evolution), and the
// export line itself should just be the species name, no "-Mega" suffix.
function stripMegaSuffix(name){
  return name.replace(/-Mega(-[XYZ])?$/i, "");
}
function isMegaName(name){
  return /-Mega(-[XYZ])?$/i.test(name);
}

// pokedex.json stores sprite paths relative to the repo root (e.g.
// "assets/sprites/garchomp.png"); pages live one folder down (usage/,
// pokemon/, demo/), so relative paths need a "../" prefix. Absolute
// fallback URLs (used when a sprite download failed) are left as-is.
function resolveSprite(sprite){
  if (!sprite) return null;
  return sprite.startsWith("http") ? sprite : "../" + sprite;
}

let state = {
  source: "bo1",           // 'bo1' | 'bo3' | 'champions'
  eloRating: 1760,          // smogon only
  champFormat: "doubles",   // 'doubles' | 'singles', champions only
  search: "",
  selectedKey: null,        // smogon: pokemon name; champions: showdownId
};

let SMOGON_MANIFEST = [];
let SMOGON_CACHE = {};      // slug -> format data
let POKEDEX = null;         // champions data, loaded once

function setFlag(text, live){
  const flag = document.getElementById("dataFlag");
  flag.className = "flag" + (live ? " live" : "");
  flag.innerHTML = '<span class="dot"></span>' + text;
}

// ---------- Data loading ----------
async function loadSmogonManifest(){
  try {
    const res = await fetch("../data/manifest.json");
    if (!res.ok) throw new Error();
    SMOGON_MANIFEST = await res.json();
  } catch { SMOGON_MANIFEST = []; }
}

function findSmogonEntry(sourceId){
  // bo1 = slug without "bo3", bo3 = slug containing "bo3"
  return SMOGON_MANIFEST.find(e => sourceId === "bo3" ? e.slug.includes("bo3") : !e.slug.includes("bo3"));
}

async function loadSmogonFormat(entry){
  if (SMOGON_CACHE[entry.slug]) return SMOGON_CACHE[entry.slug];
  const res = await fetch("../data/" + entry.file);
  if (!res.ok) throw new Error("missing data file");
  const data = await res.json();
  SMOGON_CACHE[entry.slug] = data;
  return data;
}

async function loadPokedex(){
  if (POKEDEX) return POKEDEX;
  const res = await fetch("../data/pokedex.json");
  if (!res.ok) throw new Error("missing pokedex.json");
  POKEDEX = await res.json();
  return POKEDEX;
}

// ---------- Sidebar controls ----------
function renderSourceTabs(){
  document.querySelectorAll(".source-tab").forEach(el => {
    el.classList.toggle("active", el.dataset.source === state.source);
    el.onclick = () => { state.source = el.dataset.source; state.selectedKey = null; refresh(); };
  });
}

function renderSubControls(){
  const wrap = document.getElementById("eloTabs");
  const note = document.getElementById("noEloNote");
  wrap.innerHTML = "";

  if (state.source === "champions"){
    note.style.display = "block";
    ["doubles","singles"].forEach(fmt => {
      const btn = document.createElement("div");
      btn.className = "fmt-tab" + (state.champFormat === fmt ? " active" : "");
      btn.textContent = fmt === "doubles" ? "Doubles" : "Singles";
      btn.onclick = () => { state.champFormat = fmt; renderSubControls(); renderSidebarList(); renderMain(); };
      wrap.appendChild(btn);
    });
  } else {
    note.style.display = "none";
    [0, 1500, 1630, 1760].forEach(r => {
      const btn = document.createElement("div");
      btn.className = "elo-tab" + (state.eloRating === r ? " active" : "");
      btn.textContent = r === 0 ? "0+" : r + "+";
      btn.onclick = () => { state.eloRating = r; renderSubControls(); renderSidebarList(); renderMain(); };
      wrap.appendChild(btn);
    });
  }
}

// ---------- Sidebar list ----------
async function renderSidebarList(){
  const listEl = document.getElementById("sidebarList");
  listEl.innerHTML = '<div style="padding:16px; color:var(--text-muted); font-family:\'JetBrains Mono\',monospace; font-size:0.78rem;">Loading…</div>';

  let rows = [];
  if (state.source === "champions"){
    try {
      const dex = await loadPokedex();
      setFlag(`Live: Champions Battle Data · ${dex.count} Pokémon`, true);
      rows = Object.values(dex.pokemon)
        .map(p => ({
          key: p.showdownId, name: p.name, types: p.types,
          sprite: resolveSprite(p.sprite), metric: p[state.champFormat]?.rank ?? null,
        }))
        .filter(r => r.metric !== null)
        .sort((a, b) => a.metric - b.metric);
    } catch {
      setFlag("Champions data not available — run scripts/fetch-pokedex.mjs", false);
      rows = [];
    }
  } else {
    const entry = findSmogonEntry(state.source);
    if (!entry){
      setFlag("Data not available — run scripts/fetch-usage.mjs", false);
    } else {
      try {
        const data = await loadSmogonFormat(entry);
        setFlag(`Live: ${data.label} · ${data.month}`, true);
        const list = data.ratings[state.eloRating] || [];
        rows = list.map(d => ({ key: d.name, name: d.name, types: d.types?.length ? d.types : ["Unknown"], sprite: resolveSprite(d.sprite), metric: d.usage }));
      } catch {
        setFlag("Data not available — run scripts/fetch-usage.mjs", false);
      }
    }
  }

  const q = state.search.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.name.toLowerCase().includes(q));

  // Default behavior: always show a Pokémon's data rather than an empty
  // panel — select the top row if nothing is selected yet, or if the
  // previous selection isn't in this list (e.g. after switching source).
  let selectionChanged = false;
  if (rows.length && (!state.selectedKey || !rows.find(r => r.key === state.selectedKey))){
    state.selectedKey = rows[0].key;
    selectionChanged = true;
  }

  listEl.innerHTML = "";
  if (!rows.length){
    listEl.innerHTML = '<div style="padding:16px; color:var(--text-muted); font-family:\'JetBrains Mono\',monospace; font-size:0.78rem;">No Pokémon to show yet.</div>';
    if (selectionChanged) renderMain();
    return;
  }

  rows.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "mon-row" + (state.selectedKey === r.key ? " selected" : "");
    row.onclick = () => { state.selectedKey = r.key; renderSidebarList(); renderMain(); };

    const rank = document.createElement("div");
    rank.className = "mon-rank";
    rank.textContent = i + 1;

    const avatar = document.createElement(r.sprite ? "img" : "div");
    avatar.className = "mon-avatar";
    if (r.sprite){ avatar.src = r.sprite; avatar.onerror = () => { avatar.style.display = "none"; }; }
    else {
      const c = typeColor(r.types[0]);
      avatar.style.color = c;
      avatar.textContent = r.name.slice(0, 2).toUpperCase();
    }

    const nameWrap = document.createElement("div");
    nameWrap.className = "mon-name-wrap";
    const nameEl = document.createElement("div");
    nameEl.className = "mon-name";
    nameEl.textContent = r.name;
    const typeEl = document.createElement("div");
    typeEl.className = "mon-type";
    typeEl.textContent = r.types.join(" / ");
    nameWrap.appendChild(nameEl);
    nameWrap.appendChild(typeEl);

    const metric = document.createElement("div");
    metric.className = "mon-metric";
    metric.style.color = "var(--text-muted)";
    metric.textContent = state.source === "champions" ? "#" + r.metric : r.metric.toFixed(1) + "%";

    row.appendChild(rank);
    row.appendChild(avatar);
    row.appendChild(nameWrap);
    row.appendChild(metric);
    listEl.appendChild(row);
  });

  if (selectionChanged) renderMain();
}

// ---------- Export Pokémon build state ----------
// Tracks the currently-picked item/ability/moves/nature/EVs for whichever
// Pokémon is selected, defaulting to the #1 ranked pick per category.
// Persists across re-renders of the SAME Pokémon (so clicking a button
// doesn't lose your other picks); resets when you switch Pokémon,
// source, format, or ELO tab.
let currentBuild = null;
let buildKey = null;

const STAT_LABELS = ["HP", "Atk", "Def", "SpA", "SpD", "Spe"];
function formatEvString(raw){
  if (!raw) return null;
  // Already human-formatted (contains stat letters, e.g. "252 Atk / 4 SpD")
  // — some sources give it this way already, use as-is.
  if (/[A-Za-z]/.test(raw)) return raw;
  const nums = raw.split("/").map(n => parseInt(n.trim(), 10) || 0);
  const parts = nums.map((n, i) => n > 0 ? `${n} ${STAT_LABELS[i]}` : null).filter(Boolean);
  return parts.length ? parts.join(" / ") : "0 HP";
}

function buildExportText(name, item, ability, natureName, evsRaw, moves){
  const lines = [];
  lines.push(item ? `${name} @ ${item}` : name);
  if (ability) lines.push(`Ability: ${ability}`);
  lines.push(`Level: 50`);
  const evText = formatEvString(evsRaw);
  if (evText) lines.push(`EVs: ${evText}`);
  if (natureName) lines.push(`${natureName} Nature`);
  (moves || []).forEach(m => lines.push(`- ${m}`));
  return lines.join("\n");
}

function renderExportCard(name, exportText){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<h3>Export Pokémon</h3>';
  const body = document.createElement("div");
  body.className = "card-body";
  body.style.flex = "0 0 auto"; // size to the text itself, not stretched to fill the card
  body.style.maxHeight = "200px";
  const pre = document.createElement("div");
  pre.className = "export-text";
  pre.textContent = exportText;
  body.appendChild(pre);
  card.appendChild(body);
  // Copy button sits directly under the text (not pushed to the card's
  // bottom edge), and stays visible without needing to scroll.
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "export-copy";
  copyBtn.textContent = "Copy to clipboard";
  copyBtn.onclick = () => {
    navigator.clipboard?.writeText(exportText);
    copyBtn.textContent = "Copied!";
    setTimeout(() => { copyBtn.textContent = "Copy to clipboard"; }, 1200);
  };
  card.appendChild(copyBtn);
  return card;
}

// entries: [{name, pct?}]. multi: true allows several active picks
// (moves, up to 4); false is single-select (item/ability/nature/spread).
// isActive(name) / onPick(name) let the caller own the actual state.
// Strips "HP"/"Atk"/"Def"/etc. stat labels for compact list display —
// the full labeled string is still what gets picked and shown in the
// Export card; this is presentation-only.
function shortenEvDisplay(raw){
  if (!raw) return raw;
  return raw.replace(/\s*(HP|Atk|Def|SpA|SpD|Spe)\b/gi, "").replace(/\s+/g, "").trim();
}

function selectableList(entries, emptyText, { isActive, onPick, multi = false, maxPicks = 4, compactEv = false } = {}){
  const wrap = document.createElement("div");
  wrap.className = "select-list";
  // Defensive: some upstream rows arrive with a blank name (seen for
  // certain Champions "stat_point" rows) — drop those rather than
  // rendering an unusable blank button.
  entries = (entries || []).filter(e => e && e.name && String(e.name).trim());
  if (!entries.length){
    wrap.innerHTML = `<div class="empty-note">${emptyText}</div>`;
    return wrap;
  }
  entries.forEach((e, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    const active = isActive(e.name);
    btn.className = "select-btn" + (active ? " active" : "");
    const val = e.pct ?? e.topPercentage ?? null;
    const nameSpan = document.createElement("span");
    nameSpan.className = "select-name";
    nameSpan.textContent = compactEv ? shortenEvDisplay(e.name) : e.name;
    const pctSpan = document.createElement("span");
    pctSpan.className = "select-pct" + (val === null ? " muted" : "");
    pctSpan.textContent = val !== null ? val.toFixed(1) + "%" : "#" + (i + 1);
    btn.appendChild(nameSpan);
    btn.appendChild(pctSpan);
    btn.onclick = () => onPick(e.name, active);
    wrap.appendChild(btn);
  });
  return wrap;
}

function statBarList(baseStats){
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex; flex-direction:column; justify-content:space-between; height:100%;";
  if (!baseStats){
    wrap.innerHTML = '<div class="empty-note">No stat data.</div>';
    return wrap;
  }
  [["HP", baseStats.hp], ["Attack", baseStats.attack], ["Defense", baseStats.defense],
   ["Sp. Atk", baseStats.sp_attack], ["Sp. Def", baseStats.sp_defense], ["Speed", baseStats.speed]]
    .forEach(([name, val]) => {
      const row = document.createElement("div");
      row.className = "stat-row";
      const label = document.createElement("div"); label.className = "label"; label.textContent = name;
      const track = document.createElement("div"); track.className = "track";
      const fill = document.createElement("div"); fill.className = "fill";
      fill.style.width = Math.min(100, (val / 255) * 100) + "%";
      fill.style.background = STAT_COLORS[name];
      track.appendChild(fill);
      const num = document.createElement("div"); num.className = "num"; num.textContent = val;
      row.appendChild(label); row.appendChild(track); row.appendChild(num);
      wrap.appendChild(row);
    });
  return wrap;
}
const STAT_COLORS = { "HP": "#E85D5D", "Attack": "#F0A030", "Defense": "#F0D030", "Sp. Atk": "#5088F0", "Sp. Def": "#4CAF6D", "Speed": "#F06FA8" };

// Small inline sparkline (no box/border) showing usage across the four
// ELO cutoffs — sits next to the "Usage @ X+" metric instead of a full
// bottom panel.
function renderEloSparkline(series, highlightRating){
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex; flex-direction:column; align-items:flex-start; gap:2px;";
  const w = 90, h = 30, pad = 3;
  const max = Math.max(...series.map(s => s.usage), 0.1);
  const stepX = (w - pad * 2) / (series.length - 1);
  const points = series.map((s, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (s.usage / max) * (h - pad * 2);
    return [x, y];
  });
  const pathD = points.map(([x, y], i) => (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1)).join(" ");
  const dots = points.map(([x, y], i) => {
    const active = series[i].rating === highlightRating;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${active ? 2.6 : 1.6}" fill="${active ? "var(--accent)" : "var(--accent-2)"}" />`;
  }).join("");
  wrap.innerHTML = `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <path d="${pathD}" fill="none" stroke="var(--accent-2)" stroke-width="1.5" />
      ${dots}
    </svg>
    <div style="font-family:'JetBrains Mono',monospace; font-size:0.62rem; color:var(--text-muted);">across ELO (0→1760+)</div>
  `;
  return wrap;
}

async function renderMain(){
  const main = document.getElementById("main");
  if (!state.selectedKey){
    main.innerHTML = '<div class="main-empty">Pick a data source and select a Pokémon to see its full profile.</div>';
    return;
  }

  let norm;
  if (state.source === "champions"){
    const dex = await loadPokedex().catch(() => null);
    const mon = dex?.pokemon?.[state.selectedKey];
    if (!mon){ main.innerHTML = '<div class="main-empty">Pokémon not found.</div>'; return; }
    norm = normalizeChampionsMon(mon, dex);
    if (!norm){ main.innerHTML = '<div class="main-empty">No data for this format.</div>'; return; }
  } else {
    const entry = findSmogonEntry(state.source);
    if (!entry){ main.innerHTML = '<div class="main-empty">No data source loaded.</div>'; return; }
    const data = await loadSmogonFormat(entry).catch(() => null);
    if (!data){ main.innerHTML = '<div class="main-empty">Data not available.</div>'; return; }
    const mon = (data.ratings[state.eloRating] || []).find(d => d.name === state.selectedKey);
    if (!mon){ main.innerHTML = '<div class="main-empty">Not found at this rating cutoff.</div>'; return; }
    norm = normalizeSmogonMon(mon, data);
  }

  renderUnifiedDetail(main, norm);
}

// ---------- Normalizers: turn each source's raw shape into one common
// shape, so renderUnifiedDetail never has to know which source it's
// looking at. Adding a 4th source later just means writing one more
// normalizer function. ----------

function normalizeChampionsMon(mon, dex){
  const fmtData = mon[state.champFormat];
  if (!fmtData) return null;
  return {
    buildKey: `champions:${state.champFormat}:${mon.showdownId}`,
    name: mon.name,
    types: mon.types?.length ? mon.types : ["Unknown"],
    sprite: resolveSprite(mon.sprite),
    baseStats: mon.baseStats,
    metrics: [
      { label: `${state.champFormat} rank`, value: fmtData.rank != null ? "#" + fmtData.rank : "—" },
      { label: "Base stat total", value: mon.baseStatTotal ?? "—" },
    ],
    sparkline: null,
    categories: [
      { title: "Moves", key: "moves", entries: fmtData.moves, multi: true },
      { title: "Items", key: "items", entries: fmtData.items },
      { title: "Abilities", key: "abilities", entries: fmtData.abilities },
      { title: "Natures", key: "natures", entries: fmtData.natures },
      { title: "EV spreads", key: "evSpreads", entries: fmtData.evSpreads, compactEv: true },
    ],
    teammates: fmtData.teammates,
    teammatesNote: null,
    checks: null,
    exportBaseName: mon.name,
    defaultAbilityOverride: null,
    onSelectRelated: (name) => {
      const found = Object.values(dex.pokemon).find(p => p.name === name);
      if (found){ state.selectedKey = found.showdownId; renderSidebarList(); renderMain(); }
    },
    cycleNames: Object.values(dex.pokemon).map(p => p.name),
  };
}

function normalizeSmogonMon(mon, data){
  const ratingKeys = Object.keys(data.ratings).map(Number).sort((a,b) => a - b);

  // Synergy + checks are always shown at the top-cut rating (1760+),
  // regardless of which ELO tab is active for usage.
  const synergyRating = ratingKeys.includes(1760) ? 1760 : ratingKeys[ratingKeys.length - 1];
  const synergyMon = (data.ratings[synergyRating] || []).find(d => d.name === mon.name);

  const sparkline = ratingKeys.map(r => {
    const found = (data.ratings[r] || []).find(d => d.name === mon.name);
    return { rating: r, usage: found ? found.usage : 0 };
  });

  // A Mega's recorded ability reflects what it has AFTER transforming —
  // not valid for a team export. Use the base forme's own top ability
  // instead, if the base forme is in this same list.
  let defaultAbilityOverride = null;
  if (isMegaName(mon.name)){
    const baseName = stripMegaSuffix(mon.name);
    const baseMon = (data.ratings[state.eloRating] || []).find(d => d.name === baseName);
    if (baseMon) defaultAbilityOverride = firstValid(baseMon.abilities);
  }

  return {
    buildKey: `${state.source}:${state.eloRating}:${mon.name}`,
    name: mon.name,
    types: mon.types?.length ? mon.types : ["Unknown"],
    sprite: resolveSprite(mon.sprite),
    baseStats: mon.baseStats,
    metrics: [
      { label: `Usage @ ${state.eloRating === 0 ? "0+" : state.eloRating + "+"}`, value: mon.usage.toFixed(1) + "%" },
    ],
    sparkline,
    categories: [
      { title: "Moves", key: "moves", entries: mon.moves, multi: true },
      { title: "Items", key: "items", entries: mon.items },
      { title: "Abilities", key: "abilities", entries: mon.abilities },
      { title: "Natures", key: "natures", entries: mon.natures },
      { title: "EV spreads", key: "evSpreads", entries: mon.evSpreads, compactEv: true },
    ],
    teammates: synergyMon?.teammates,
    teammatesNote: `${synergyRating === 0 ? "0+" : synergyRating + "+"}`,
    checks: mon.checks,
    exportBaseName: stripMegaSuffix(mon.name),
    defaultAbilityOverride,
    onSelectRelated: (name) => { state.selectedKey = name; renderSidebarList(); renderMain(); },
    cycleNames: (data.ratings[state.eloRating] || []).map(d => d.name),
  };
}

// ---------- The one shared layout, used by every source ----------
function renderUnifiedDetail(main, norm){
  const color = typeColor(norm.types[0]);

  // Reset the build only when the Pokémon/source/format/rating actually
  // changes — clicking a button in the lists below re-renders this same
  // function, and should keep whatever's already been picked.
  if (buildKey !== norm.buildKey){
    buildKey = norm.buildKey;
    const abilities = norm.categories.find(c => c.key === "abilities")?.entries;
    const items = norm.categories.find(c => c.key === "items")?.entries;
    const natures = norm.categories.find(c => c.key === "natures")?.entries;
    const evSpreads = norm.categories.find(c => c.key === "evSpreads")?.entries;
    const moves = norm.categories.find(c => c.key === "moves")?.entries;
    currentBuild = {
      item: firstValid(items),
      ability: norm.defaultAbilityOverride || firstValid(abilities),
      nature: firstValid(natures),
      evs: firstValid(evSpreads),
      moves: (moves || []).filter(m => m?.name).slice(0, 4).map(m => m.name),
    };
  }

  main.innerHTML = "";

  // ---- Hero ----
  const hero = document.createElement("div");
  hero.className = "detail-hero";
  const avatarWrap = document.createElement("div");
  avatarWrap.className = "detail-avatar-wrap";
  const avatar = document.createElement(norm.sprite ? "img" : "div");
  avatar.className = "detail-avatar";
  if (norm.sprite){ avatar.src = norm.sprite; } else { avatar.textContent = norm.name.slice(0,2).toUpperCase(); avatar.style.color = color; }
  avatarWrap.appendChild(avatar);
  const cycleBtn = renderFormeCycleButton(norm.cycleNames, norm.name, norm.onSelectRelated);
  if (cycleBtn) avatarWrap.appendChild(cycleBtn);

  const titleWrap = document.createElement("div");
  titleWrap.className = "detail-title";
  titleWrap.innerHTML = `<h2>${norm.name}</h2>`;
  const badges = document.createElement("div");
  badges.className = "type-badges";
  norm.types.forEach(t => {
    const c = typeColor(t);
    const b = document.createElement("span");
    b.className = "type-badge";
    b.textContent = t;
    b.style.background = c + "26"; b.style.border = "1px solid " + c + "66"; b.style.color = c;
    badges.appendChild(b);
  });
  titleWrap.appendChild(badges);

  const metrics = document.createElement("div");
  metrics.className = "detail-metrics";
  metrics.style.alignItems = "center";
  if (norm.sparkline) metrics.appendChild(renderEloSparkline(norm.sparkline, state.eloRating));
  norm.metrics.forEach(m => {
    const el = document.createElement("div");
    el.className = "metric";
    el.innerHTML = `<div class="num">${m.value}</div><div class="lbl">${m.label}</div>`;
    metrics.appendChild(el);
  });

  hero.appendChild(avatarWrap); hero.appendChild(titleWrap); hero.appendChild(metrics);
  main.appendChild(hero);

  // ---- Grid: same 3-column layout for every source ----
  const grid = document.createElement("div");
  grid.className = "grid3";

  const statsCard = document.createElement("div");
  statsCard.className = "card";
  statsCard.innerHTML = "<h3>Base stats</h3>";
  const statsBody = document.createElement("div"); statsBody.className = "card-body";
  statsBody.appendChild(statBarList(norm.baseStats));
  statsCard.appendChild(statsBody);
  grid.appendChild(statsCard);

  const rerender = () => renderMain();

  const BUILD_FIELD = { moves: "moves", items: "item", abilities: "ability", natures: "nature", evSpreads: "evs" };

  norm.categories.forEach(cat => {
    const card = document.createElement("div");
    card.className = "card";
    const h = document.createElement("h3"); h.textContent = cat.title;
    card.appendChild(h);
    const body = document.createElement("div"); body.className = "card-body";

    let opts;
    if (cat.key === "moves"){
      opts = {
        multi: true,
        isActive: (n) => currentBuild.moves.includes(n),
        onPick: (n, active) => {
          if (active) currentBuild.moves = currentBuild.moves.filter(m => m !== n);
          else if (currentBuild.moves.length < 4) currentBuild.moves.push(n);
          else currentBuild.moves = [...currentBuild.moves.slice(1), n];
          rerender();
        },
      };
    } else {
      const field = BUILD_FIELD[cat.key];
      opts = {
        compactEv: !!cat.compactEv,
        isActive: (n) => currentBuild[field] === n,
        onPick: (n) => { currentBuild[field] = n; rerender(); },
      };
    }

    body.appendChild(selectableList(cat.entries, `No ${cat.title.toLowerCase()} data.`, opts));
    card.appendChild(body);
    grid.appendChild(card);
  });

  const teamCard = document.createElement("div");
  teamCard.className = "card";
  teamCard.innerHTML = `<h3>Top teammates${norm.teammatesNote ? ` <span style="color:var(--text-muted); font-weight:400; font-size:0.72rem;">(${norm.teammatesNote})</span>` : ""}</h3>`;
  const teamCloud = document.createElement("div");
  teamCloud.className = "tag-cloud";
  if (norm.teammates?.length){
    norm.teammates.forEach(t => {
      const pill = document.createElement("span");
      pill.className = "teammate-pill";
      pill.innerHTML = t.name + (typeof t.pct === "number" ? " <b>" + t.pct.toFixed(1) + "%</b>" : "");
      pill.onclick = () => norm.onSelectRelated(t.name);
      teamCloud.appendChild(pill);
    });
  } else {
    teamCloud.innerHTML = '<div class="empty-note">No teammate data.</div>';
  }
  const teamBody = document.createElement("div"); teamBody.className = "card-body";
  teamBody.appendChild(teamCloud);
  teamCard.appendChild(teamBody);
  grid.appendChild(teamCard);

  if (norm.checks){
    const checksCard = document.createElement("div");
    checksCard.className = "card";
    checksCard.innerHTML = "<h3>Checks & Counters</h3>";
    const checksCloud = document.createElement("div");
    checksCloud.className = "tag-cloud";
    if (norm.checks.length){
      norm.checks.forEach(c => {
        const pill = document.createElement("span");
        pill.className = "teammate-pill";
        pill.innerHTML = c.name + " <b>" + c.pct.toFixed(1) + "%</b>";
        pill.onclick = () => norm.onSelectRelated(c.name);
        checksCloud.appendChild(pill);
      });
    } else {
      checksCloud.innerHTML = '<div class="empty-note">No checks/counters data at this cutoff.</div>';
    }
    const checksBody = document.createElement("div"); checksBody.className = "card-body";
    checksBody.appendChild(checksCloud);
    checksCard.appendChild(checksBody);
    grid.appendChild(checksCard);
  }

  grid.appendChild(renderExportCard(
    norm.exportBaseName,
    buildExportText(norm.exportBaseName, currentBuild.item, currentBuild.ability, currentBuild.nature, currentBuild.evs, currentBuild.moves)
  ));

  main.appendChild(grid);
}


// ---------- Wire up ----------
document.getElementById("search").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderSidebarList();
});

// ---------- Mobile hamburger menu ----------
const sidebarEl = document.getElementById("sidebar");
const backdropEl = document.getElementById("sidebarBackdrop");
function openSidebar(){ sidebarEl.classList.add("open"); backdropEl.classList.add("open"); }
function closeSidebar(){ sidebarEl.classList.remove("open"); backdropEl.classList.remove("open"); }
document.getElementById("menuToggle").addEventListener("click", () => {
  sidebarEl.classList.contains("open") ? closeSidebar() : openSidebar();
});
backdropEl.addEventListener("click", closeSidebar);
// Picking a Pokémon on mobile should close the sidebar so the profile
// is immediately visible — patch the click behavior in one place rather
// than threading a "close on mobile" flag through renderSidebarList.
document.getElementById("sidebarList").addEventListener("click", (e) => {
  if (e.target.closest(".mon-row") && window.innerWidth <= 860) closeSidebar();
});

async function refresh(){
  renderSourceTabs();
  renderSubControls();
  await renderSidebarList();
  await renderMain();
}

(async function init(){
  renderSourceTabs();
  await loadSmogonManifest();
  await refresh();
})();
</script>
